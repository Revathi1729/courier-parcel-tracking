<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Courier and Parcel Tracking System</h1>
    <p>Payment Management</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="customers.html">Customers</a>
    <a href="book-parcel.html">Book Parcel</a>
    <a href="parcels.html">View Parcels</a>
    <a href="tracking.html">Track Parcel</a>
    <a href="update-tracking.html">Update Tracking</a>
    <a href="payments.html">Payments</a>
</nav>

<div class="form-container">
    <h2>Add Payment</h2>

    <form id="paymentForm">
        <label>Parcel ID</label>
        <select id="paymentParcelId" required>
            <option value="">Select Parcel</option>
        </select>

        <label>Amount</label>
        <input type="number" id="amount" step="0.01" min="0.01" required>

        <label>Payment Method</label>
        <select id="payment_method" required>
            <option value="">Select Method</option>
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
            <option value="Card">Card</option>
            <option value="Net Banking">Net Banking</option>
        </select>

        <label>Payment Status</label>
        <select id="payment_status" required>
            <option value="">Select Status</option>
            <option value="Paid">Paid</option>
            <option value="Pending">Pending</option>
        </select>

        <button type="submit">Save Payment</button>
    </form>
</div>

<div class="table-container">
    <h2>Payment Details</h2>
    <table>
        <thead>
            <tr>
                <th>Payment ID</th>
                <th>Parcel ID</th>
                <th>Amount</th>
                <th>Method</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="paymentTable"></tbody>
    </table>
</div>

<script src="script.js"></script>
</body>
</html>
