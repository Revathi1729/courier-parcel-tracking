
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Parcel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Parcel Booking</h1>
        <p>Book your courier parcel</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="customers.html">Customers</a>
        <a href="book-parcel.html">Book Parcel</a>
        <a href="parcels.html">View Parcels</a>
        <a href="tracking.html">Track Parcel</a>
        <a href="update-tracking.html">Update Tracking</a>
        <a href="payments.html">Payments</a>
    </nav>

    <section class="form-container">

        <h2>Book a New Parcel</h2>

        <form id="parcelForm">

            <label>Select Customer</label>
            <select id="customer_id" required>
                <option value="">Select Customer</option>
            </select>

            <label>Sender Address</label>
            <textarea id="sender_address" required></textarea>

            <label>Receiver Name</label>
            <input type="text" id="receiver_name" required>

            <label>Receiver Phone</label>
            <input type="text" id="receiver_phone" maxlength="15" required>

            <label>Receiver Address</label>
            <textarea id="receiver_address" required></textarea>

            <label>Parcel Weight (kg)</label>
            <input type="number" id="weight" step="0.01" min="0.01" required>

            <button type="submit">Book Parcel</button>

        </form>

    </section>

    <script src="script.js"></script>

</body>
</html>
