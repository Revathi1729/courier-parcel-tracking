<div class="form-container">
    <h2>Track Parcel</h2>

    <form id="trackingSearchForm">
        <label>Parcel ID</label>
        <select id="trackParcelId" required>
    <option value="">Select Parcel ID</option>
</select>

    </form>

    <table>
        <thead>
            <tr>
                <th>Location</th>
                <th>Status</th>
                <th>Updated At</th>
                <th>Remarks</th>
            </tr>
        </thead>
        <tbody id="trackingTable"></tbody>
    </table>
</div>
