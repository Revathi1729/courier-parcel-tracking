
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Customer Management</h1>
        <p>Register and manage courier customers</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="customers.html">Customers</a>
        <a href="book-parcel.html">Book Parcel</a>
        <a href="parcels.html">View Parcels</a>
        <a href="tracking.html">Track Parcel</a>
         <a href="update-tracking.html">Update Tracking</a>
        <a href="payments.html">Payments</a>
    </nav>

    <section class="form-container">
        <h2>Customer Registration</h2>

        <form id="customerForm">

            <label>Customer Name</label>
            <input type="text" id="name" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Phone Number</label>
            <input type="text" id="phone" maxlength="15" required>

            <label>Address</label>
            <textarea id="address" required></textarea>

            <button type="submit">Register Customer</button>

        </form>
    </section>

    <section class="table-container">
        <h2>Customer Details</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                </tr>
            </thead>

            <tbody id="customerTable"></tbody>
        </table>
    </section>

    <script src="script.js"></script>

</body>
</html>
